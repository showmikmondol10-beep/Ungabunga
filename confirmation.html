<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f1efff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Registration Confirmation | CPSCR Cultural Fest</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 16px;display:grid;place-items:center;background:linear-gradient(135deg,#f4f0ff 0%,#eef8ff 48%,#f4f1ff 100%);font-family:Montserrat,Arial,sans-serif;color:#24233a}.scene{position:fixed;inset:0;overflow:hidden;pointer-events:none}.bubble{position:absolute;bottom:-90px;border:1px solid #ffffffb8;border-radius:50%;background:linear-gradient(135deg,#ffffff80,#b9adff20);box-shadow:inset 0 0 22px #ffffff70;animation:float 22s linear infinite}.b1{left:8%;width:55px;height:55px}.b2{left:29%;width:25px;height:25px;animation-delay:-8s}.b3{left:55%;width:78px;height:78px;animation-delay:-14s}.b4{left:83%;width:42px;height:42px;animation-delay:-4s}@keyframes float{to{transform:translateY(-120vh) translateX(25px);opacity:0}}.wrap{position:relative;width:min(100%,620px)}.brand{display:flex;align-items:center;gap:10px;margin:0 0 18px 6px;color:#77748e;font-size:12px;font-weight:700;letter-spacing:.1em}.mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#6757d9,#a08cf7);display:grid;place-items:center;color:white}.card{overflow:hidden;border:1px solid #eeecf5;border-radius:26px;background:white;box-shadow:0 22px 70px #35305b14;text-align:center}.top{height:12px;background:linear-gradient(90deg,#6655d5,#a08cf7)}.content{padding:54px 34px 48px}.check{width:76px;height:76px;margin:0 auto 23px;border-radius:50%;display:grid;place-items:center;background:#e8f7f0;color:#239967;font-size:39px;font-weight:700}.eyebrow{color:#6757d9;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.content h1{margin:12px 0;font-size:clamp(27px,5vw,36px);letter-spacing:-.04em}.content p{max-width:420px;margin:0 auto;color:#77768c;font-size:14px;line-height:1.8}.btn{display:inline-block;margin-top:28px;padding:14px 22px;border-radius:12px;background:linear-gradient(100deg,#6655d5,#8978ed);color:white;text-decoration:none;font-size:14px;font-weight:700;box-shadow:0 9px 20px #6757d933}.foot{margin:17px 0 0;text-align:center;color:#9290a3;font-size:11px}@media(prefers-reduced-motion:reduce){.bubble{display:none;animation:none}}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"><span class="bubble b1"></span><span class="bubble b2"></span><span class="bubble b3"></span><span class="bubble b4"></span></div>
<main class="wrap">
  <div class="brand"><span class="mark">✦</span> CPSCR CULTURAL FEST</div>
  <section class="card">
    <div class="top"></div>
    <div class="content">
      <div class="check">✓</div>
      <div class="eyebrow">Registration confirmation</div>
      <h1>Thank you!</h1>
      <p>Your registration has been submitted. Thank you for being part of CPSCR Cultural Fest. We look forward to seeing you there!</p>
      <a class="btn" href="index.html">Back to registration</a>
    </div>
  </section>
  <p class="foot">CPSCR Cultural Fest · We’re glad you’re joining us</p>
</main>
</body>
</html>
